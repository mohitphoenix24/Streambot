[pytest]
# Lets tests `import app.*` from the AI/ directory.
pythonpath = .
testpaths = tests
asyncio_mode = auto
# Dev-machine quirk: if a ROS workspace is sourced, its PYTHONPATH leaks ament_* /
# launch_* pytest plugins into this venv and they crash on missing deps. Blocking
# them by name is a no-op on machines without ROS.
addopts = -p no:ament_pep257 -p no:ament_black -p no:ament_xmllint -p no:ament_copyright
          -p no:ament_mypy -p no:ament_lint -p no:ament_flake8 -p no:launch_ros
          -p no:launch_testing -p no:launch_pytest
